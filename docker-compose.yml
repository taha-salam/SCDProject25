version: "3.9"

services:
  mongo:
    image: mongo:latest
    container_name: scd-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - scd-network

  backend:
    build: .
    command: node index.js --host 0.0.0.0
    container_name: scd-backend
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/nodevault
      - PORT=3000
      - HOST=0.0.0.0
    networks:
      - scd-network

networks:
  scd-network:
    driver: bridge

volumes:
  mongo-data:
